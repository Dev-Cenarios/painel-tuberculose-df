name: CI

# As extrações do SINAN não estão no repositório (exigem acesso ao banco do
# projeto), então o CI roda o que não depende delas: tema, navegação,
# componentes, montagem das opções ECharts e a varredura de segredos. O resto
# pula com mensagem explícita — ver tests/conftest.py, que confere as duas
# extrações separadamente.
#
# O que isto protege: import quebrado, erro de sintaxe, lock que não instala
# mais, componente sem os arquivos vendorados, Dockerfile que não constrói.
# O que NÃO protege: os números e a paridade com o Boletim, que precisam dos
# dados. Esses continuam sendo responsabilidade do `pytest` local antes do
# deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.13 porque é a da imagem de produção (python:3.13-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instala as versões que estão no ar
        run: pip install -r requirements.lock.txt pytest ruff

      # Só as regras que pegam bug (F): nome indefinido, import quebrado,
      # variável nunca usada. Formatação não é assunto do CI.
      - name: Ruff
        run: ruff check --select F app.py src tests

      - name: Testes
        run: python -m pytest -q -rs

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Constrói a imagem
        run: docker build -t dftb:ci .

      # `--entrypoint`: a imagem tem o Streamlit como ENTRYPOINT, e sem isto
      # o comando vira argumento do servidor, que sobe e fica no ar até o
      # runner cancelar o job por tempo.
      - name: A imagem carrega os componentes vendorados
        run: |
          docker run --rm --entrypoint ls dftb:ci src/componente_grafico/echarts.min.js
          docker run --rm --entrypoint python dftb:ci -c "import cenarios_core.mapa_componente as m; assert (m.DIRETORIO / 'deck.min.js').is_file()"
